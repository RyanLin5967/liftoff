<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voyage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #020208; color: #fff; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
    #canvas-container { position: fixed; inset: 0; }

    /* UI overlay */
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #ui > * { pointer-events: auto; }

    /* Year slider */
    #slider-container {
      position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
      width: min(90%, 700px); display: flex; align-items: center; gap: 16px;
      background: rgba(0,0,0,0.5); padding: 12px 24px; border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    #year-slider { flex: 1; accent-color: #6b8afd; cursor: pointer; }
    #year-display { font-size: 14px; opacity: 0.8; min-width: 120px; text-align: center; }

    /* Info panels */
    #light-panel {
      position: absolute; top: 24px; left: 24px;
      background: rgba(0,0,0,0.5); padding: 16px 20px; border-radius: 10px;
      backdrop-filter: blur(8px); font-size: 14px; max-width: 380px;
      line-height: 1.6; transition: opacity 0.3s;
    }
    #light-panel .label { opacity: 0.5; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    #light-panel .value { font-size: 20px; font-weight: 500; margin-top: 4px; }
    #light-panel .sublabel { opacity: 0.6; margin-top: 8px; font-size: 13px; }

    /* Milestone notification */
    #milestone-toast {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7); padding: 16px 32px; border-radius: 10px;
      backdrop-filter: blur(12px); font-size: 16px; text-align: center;
      opacity: 0; transition: opacity 0.5s; pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    #milestone-toast.visible { opacity: 1; }

    /* Memory pin popup */
    #pin-panel {
      position: absolute; top: 24px; right: 24px; width: 340px;
      background: rgba(0,0,0,0.6); padding: 24px; border-radius: 12px;
      backdrop-filter: blur(12px); transform: translateX(400px);
      transition: transform 0.3s ease; border: 1px solid rgba(255,255,255,0.08);
    }
    #pin-panel.open { transform: translateX(0); }
    #pin-panel .pin-author { font-size: 12px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
    #pin-panel .pin-title { font-size: 18px; font-weight: 500; margin: 8px 0; }
    #pin-panel .pin-text { font-size: 14px; line-height: 1.7; opacity: 0.85; }
    #pin-panel .pin-meta { font-size: 12px; opacity: 0.4; margin-top: 12px; }
    #pin-panel .close-btn {
      position: absolute; top: 12px; right: 16px; background: none; border: none;
      color: #fff; font-size: 20px; cursor: pointer; opacity: 0.5;
    }
    #pin-panel .close-btn:hover { opacity: 1; }

    /* Audio toggle */
    #audio-btn {
      position: absolute; bottom: 100px; right: 24px;
      background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.15);
      color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer;
      font-size: 13px; backdrop-filter: blur(8px);
    }

    /* Loading screen */
    #loading {
      position: fixed; inset: 0; background: #020208; display: flex;
      align-items: center; justify-content: center; z-index: 100;
      font-size: 16px; opacity: 0.6;
    }
    #loading.hidden { display: none; }
  </style>
</head>
<body>
  <div id="loading">Loading voyage data...</div>
  <div id="canvas-container"></div>

  <div id="ui">
    <div id="light-panel">
      <div class="label">Light from Earth</div>
      <div class="value" id="earth-year-display">Year 2750</div>
      <div class="sublabel" id="light-sublabel">Earth's light is reaching you now</div>
    </div>

    <div id="slider-container">
      <span style="font-size:12px;opacity:0.5">Sol</span>
      <input type="range" id="year-slider" min="0" max="250" step="0.1" value="0">
      <span style="font-size:12px;opacity:0.5">Proxima</span>
      <div id="year-display">Year 0 of 250</div>
    </div>

    <div id="milestone-toast"></div>

    <div id="pin-panel">
      <button class="close-btn" onclick="document.getElementById('pin-panel').classList.remove('open')">&times;</button>
      <div class="pin-author" id="pin-author"></div>
      <div class="pin-title" id="pin-title"></div>
      <div class="pin-text" id="pin-text"></div>
      <div class="pin-meta" id="pin-meta"></div>
    </div>

    <button id="audio-btn" onclick="toggleAudio()">🔊 Audio</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    // ===== This is where the frontend person builds the Three.js scene =====
    // The imports below show how to connect to the backend modules.

    import * as Voyage from './src/voyage-engine.js';
    import * as Audio from './src/audio-engine.js';

    // Initialize
    const { starsData, voyageData } = await Voyage.init();
    await Audio.init();
    console.log(`Loaded ${starsData.length} stars, ${voyageData.trajectory.length} waypoints`);

    document.getElementById('loading').classList.add('hidden');

    let audioStarted = false;
    let lastMilestoneIdx = -1;
    let milestoneTimeout = null;

    // ===== SLIDER HANDLER =====
    const slider = document.getElementById('year-slider');
    slider.addEventListener('input', (e) => {
      // Start audio on first interaction (browser autoplay policy)
      if (!audioStarted) { Audio.start(); audioStarted = true; }

      const year = parseFloat(e.target.value);
      const wp = Voyage.getWaypoint(year);

      // Update year display
      document.getElementById('year-display').textContent = `Year ${Math.round(year)} of 250`;

      // Update light panel
      const lh = Voyage.getLightHorizon();
      const earthYearEl = document.getElementById('earth-year-display');
      const sublabelEl = document.getElementById('light-sublabel');

      if (Voyage.isPastLightHorizon(year)) {
        earthYearEl.textContent = `Silence`;
        sublabelEl.textContent = `No light from Earth will ever reach this ship again. Last received: Earth year ${lh.last_earth_year}.`;
      } else {
        earthYearEl.textContent = `Year ${Math.round(wp.earthLightYear)}`;
        const yearsUntilHorizon = lh.ship_year - year;
        if (yearsUntilHorizon < 30) {
          sublabelEl.textContent = `Light horizon in ${Math.round(yearsUntilHorizon)} years`;
        } else {
          sublabelEl.textContent = `Earth's light is reaching you now`;
        }
      }

      // Check milestones
      const milestones = Voyage.getActiveMilestones(wp.waypointIndex, 5);
      if (milestones.length > 0 && milestones[0].waypoint_index !== lastMilestoneIdx) {
        lastMilestoneIdx = milestones[0].waypoint_index;
        showMilestone(milestones[0].label);
      }

      // Check pins
      const pins = Voyage.getActivePins(wp.waypointIndex, 8);
      // Frontend person: render pin markers and handle clicks here

      // Update audio
      Audio.update(year, lh.ship_year);

      // ===== Frontend person: update Three.js scene here =====
      // const positions = Voyage.getStarPositions(wp.x, wp.y, wp.z);
      // starGeometry.attributes.position.array.set(positions);
      // starGeometry.attributes.position.needsUpdate = true;
    });

    function showMilestone(label) {
      const toast = document.getElementById('milestone-toast');
      toast.textContent = label;
      toast.classList.add('visible');
      clearTimeout(milestoneTimeout);
      milestoneTimeout = setTimeout(() => toast.classList.remove('visible'), 3000);
    }

    // Pin display (called by frontend when a pin marker is clicked)
    window.showPin = function(pin) {
      document.getElementById('pin-author').textContent = pin.author;
      document.getElementById('pin-title').textContent = pin.title;
      document.getElementById('pin-text').textContent = pin.text;
      document.getElementById('pin-meta').textContent = `Generation ${pin.generation} · Year ${pin.year}`;
      document.getElementById('pin-panel').classList.add('open');
    };

    // Audio toggle
    window.toggleAudio = function() {
      if (!audioStarted) { Audio.start(); audioStarted = true; }
      const muted = Audio.toggleMute();
      document.getElementById('audio-btn').textContent = muted ? '🔇 Muted' : '🔊 Audio';
    };
  </script>
</body>
</html>
