<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage — Sol to Proxima Centauri</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020208;
            color: #e8eef8;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        #canvas-container canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .ui-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        .ui-overlay > * {
            pointer-events: auto;
        }

        .panel {
            background: rgba(4, 8, 18, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 170, 220, 0.12);
            border-radius: 6px;
            padding: 14px 16px;
            color: #e8eef8;
            font-size: 13px;
            line-height: 1.5;
        }

        #light-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: 320px;
        }

        #light-panel .label {
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #7a8aa8;
            margin-bottom: 6px;
        }

        #light-panel .primary {
            font-size: 15px;
            color: #cfe1ff;
        }

        #light-panel .secondary {
            margin-top: 8px;
            color: #9aa9c4;
            font-size: 12px;
        }

        #light-panel.past-horizon .primary {
            color: #ffb38a;
        }

        #sol-status {
            position: absolute;
            top: 20px;
            right: 20px;
            min-width: 220px;
            text-align: right;
        }

        #sol-status .label {
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #7a8aa8;
            margin-bottom: 6px;
        }

        #sol-status .magnitude {
            font-size: 22px;
            font-variant-numeric: tabular-nums;
            color: #fff4d6;
        }

        #sol-status .visibility {
            font-size: 11px;
            color: #9aa9c4;
            margin-top: 2px;
        }

        #slider-container {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: min(720px, 80vw);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 10px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
        }

        #timeline {
            position: relative;
            width: 100%;
            height: 22px;
        }

        #timeline #slider {
            position: absolute;
            inset: 9px 0 auto 0;
            width: 100%;
        }

        #timeline-pins {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .timeline-pin {
            position: absolute;
            top: 50%;
            width: 10px;
            height: 10px;
            margin-left: -5px;
            margin-top: -5px;
            border-radius: 50%;
            background: rgba(255, 200, 120, 0.85);
            box-shadow: 0 0 8px rgba(255, 180, 90, 0.7);
            border: 1px solid rgba(255, 230, 180, 0.9);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            z-index: 2;
        }

        .timeline-pin:hover,
        .timeline-pin.active {
            transform: scale(1.5);
            background: #ffe7b8;
            box-shadow: 0 0 14px rgba(255, 220, 160, 0.95);
        }

        .timeline-pin .pin-label {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            background: rgba(4, 8, 18, 0.85);
            border: 1px solid rgba(180, 210, 255, 0.18);
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 11px;
            color: #cfe1ff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.12s ease;
        }

        .timeline-pin:hover .pin-label {
            opacity: 1;
        }

        #year-display {
            font-size: 13px;
            color: #cfe1ff;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
        }

        #year-display .current {
            font-size: 18px;
            color: #ffffff;
            margin-right: 4px;
        }

        #destination-label {
            font-size: 12px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #9aa9c4;
        }

        #destination-label .arrow {
            color: #6677aa;
            margin-right: 6px;
        }

        #destination-label .name {
            color: #cfe1ff;
            letter-spacing: 0.6px;
        }

        #slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: rgba(140, 170, 220, 0.22);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        #slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #cfe1ff;
            border: 2px solid #ffffff;
            box-shadow: 0 0 12px rgba(180, 210, 255, 0.6);
            cursor: pointer;
        }

        #slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #cfe1ff;
            border: 2px solid #ffffff;
            box-shadow: 0 0 12px rgba(180, 210, 255, 0.6);
            cursor: pointer;
        }

        #mute-button,
        #settings-button,
        #add-memory-button {
            position: absolute;
            bottom: 28px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(4, 8, 18, 0.62);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(140, 170, 220, 0.18);
            color: #cfe1ff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: background 0.15s ease;
        }

        #mute-button { right: 28px; }
        #settings-button { right: 76px; font-size: 18px; }
        #add-memory-button { right: 124px; font-size: 22px; line-height: 1; }

        #mute-button:hover,
        #settings-button:hover,
        #add-memory-button:hover {
            background: rgba(20, 30, 55, 0.8);
        }

        #memory-form-overlay {
            position: absolute;
            inset: 0;
            background: rgba(2, 4, 10, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        #memory-form-overlay.open { display: flex; }

        #memory-form {
            width: min(440px, 92vw);
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px 26px;
        }

        #memory-form .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        #memory-form .form-title {
            font-size: 11px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #7a8aa8;
        }

        #memory-form .form-close {
            background: transparent;
            border: none;
            color: #7a8aa8;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 0;
        }

        #memory-form .form-close:hover { color: #fff; }

        #memory-form .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 14px;
        }

        #memory-form .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        #memory-form label {
            font-size: 10px;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: #7a8aa8;
        }

        #memory-form input,
        #memory-form textarea {
            width: 100%;
            padding: 8px 10px;
            background: rgba(8, 14, 28, 0.85);
            border: 1px solid rgba(140, 170, 220, 0.2);
            border-radius: 3px;
            color: #e8eef8;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            resize: vertical;
        }

        #memory-form textarea {
            min-height: 110px;
        }

        #memory-form input:focus,
        #memory-form textarea:focus {
            border-color: rgba(180, 210, 255, 0.55);
        }

        #memory-form .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        #memory-form button[type="submit"],
        #memory-form button[type="button"].cancel {
            flex: 1;
            padding: 10px;
            border-radius: 3px;
            font-size: 12px;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #memory-form button[type="submit"] {
            background: rgba(80, 130, 220, 0.55);
            border: 1px solid rgba(180, 210, 255, 0.5);
            color: #fff;
        }

        #memory-form button[type="submit"]:hover {
            background: rgba(100, 150, 240, 0.7);
        }

        #memory-form button[type="button"].cancel {
            background: rgba(20, 30, 55, 0.6);
            border: 1px solid rgba(140, 170, 220, 0.2);
            color: #cfe1ff;
        }

        #memory-form button[type="button"].cancel:hover {
            background: rgba(40, 60, 100, 0.7);
        }

        .timeline-pin.user-pin {
            background: rgba(180, 220, 255, 0.9);
            box-shadow: 0 0 8px rgba(150, 200, 255, 0.7);
            border-color: rgba(220, 235, 255, 0.95);
        }

        .timeline-pin.user-pin:hover,
        .timeline-pin.user-pin.active {
            background: #e6f1ff;
            box-shadow: 0 0 14px rgba(200, 225, 255, 0.95);
        }

        #settings-panel {
            position: absolute;
            bottom: 80px;
            right: 28px;
            width: 280px;
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #settings-panel.open {
            opacity: 1;
            transform: none;
            pointer-events: auto;
        }

        #settings-panel .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        #settings-panel .settings-title {
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #7a8aa8;
        }

        #settings-panel .settings-close {
            background: transparent;
            border: none;
            color: #7a8aa8;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            padding: 0;
        }

        #settings-panel .settings-close:hover { color: #fff; }

        #settings-panel label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #9aa9c4;
            margin-bottom: 10px;
        }

        #settings-panel input[type="number"] {
            width: 90px;
            padding: 4px 8px;
            background: rgba(8, 14, 28, 0.8);
            border: 1px solid rgba(140, 170, 220, 0.2);
            border-radius: 3px;
            color: #e8eef8;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            outline: none;
        }

        #settings-panel input[type="number"]:focus {
            border-color: rgba(180, 210, 255, 0.55);
        }

        #settings-panel .destination-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #9aa9c4;
            margin-bottom: 14px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(140, 170, 220, 0.12);
        }

        #settings-panel .destination-row .name {
            color: #cfe1ff;
            font-weight: 500;
        }

        #settings-panel .settings-reset {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            background: rgba(20, 30, 55, 0.6);
            border: 1px solid rgba(140, 170, 220, 0.2);
            border-radius: 3px;
            color: #cfe1ff;
            font-size: 12px;
            letter-spacing: 0.4px;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        #settings-panel .settings-reset:hover {
            background: rgba(40, 60, 100, 0.7);
        }

        #pin-popup {
            position: absolute;
            top: 0;
            right: 0;
            width: min(420px, 92vw);
            height: 100%;
            background: rgba(4, 8, 18, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid rgba(140, 170, 220, 0.16);
            padding: 60px 36px 40px;
            transform: translateX(100%);
            transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
            overflow-y: auto;
        }

        #pin-popup.open {
            transform: translateX(0);
        }

        #pin-popup .close {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 28px;
            height: 28px;
            border: none;
            background: transparent;
            color: #9aa9c4;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        #pin-popup .close:hover { color: #fff; }

        #pin-popup .meta {
            font-size: 10px;
            letter-spacing: 1.6px;
            text-transform: uppercase;
            color: #7a8aa8;
            margin-bottom: 8px;
        }

        #pin-popup .title {
            font-size: 22px;
            color: #fff;
            margin-bottom: 6px;
            font-weight: 500;
        }

        #pin-popup .author {
            font-size: 13px;
            color: #cfe1ff;
            margin-bottom: 24px;
        }

        #pin-popup .text {
            font-size: 14px;
            line-height: 1.7;
            color: #c6d2e6;
            white-space: pre-wrap;
        }

        #milestone-toast {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateY(-20px);
            padding: 14px 22px;
            background: rgba(4, 8, 18, 0.82);
            border: 1px solid rgba(180, 210, 255, 0.3);
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            letter-spacing: 0.4px;
            opacity: 0;
            transition: opacity 0.4s ease, transform 0.4s ease;
            pointer-events: none;
        }

        #milestone-toast.visible {
            opacity: 1;
            transform: translate(-50%, -50%);
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020208;
            color: #cfe1ff;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            z-index: 100;
            transition: opacity 0.6s ease;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.162.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <div id="loading">Loading voyage…</div>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <div id="light-panel" class="panel">
            <div class="label">Light from Earth</div>
            <div class="primary">—</div>
            <div class="secondary">—</div>
        </div>

        <div id="sol-status" class="panel">
            <div class="label">Sol — apparent magnitude</div>
            <div class="magnitude">—</div>
            <div class="visibility">—</div>
        </div>

        <div id="slider-container">
            <div class="slider-header">
                <div id="year-display"><span class="current">0.0</span>of 250 years</div>
                <div id="destination-label"><span class="arrow">→</span><span class="name">Proxima Centauri</span></div>
            </div>
            <div id="timeline">
                <input id="slider" type="range" min="0" max="250" step="0.1" value="0">
                <div id="timeline-pins"></div>
            </div>
        </div>

        <button id="add-memory-button" title="Add a memory entry">+</button>
        <button id="settings-button" title="Timeline settings">⚙</button>
        <button id="mute-button" title="Toggle audio">♪</button>

        <div id="memory-form-overlay">
            <form id="memory-form" class="panel" autocomplete="off">
                <div class="form-header">
                    <span class="form-title">New memory</span>
                    <button type="button" class="form-close" aria-label="Close">×</button>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label for="memory-year">Year</label>
                        <input id="memory-year" type="number" min="0" step="0.1" required>
                    </div>
                    <div class="field">
                        <label for="memory-generation">Generation</label>
                        <input id="memory-generation" type="number" min="1" step="1" value="1" required>
                    </div>
                </div>
                <div class="field">
                    <label for="memory-title">Title</label>
                    <input id="memory-title" type="text" maxlength="80" required>
                </div>
                <div class="field">
                    <label for="memory-author">Author</label>
                    <input id="memory-author" type="text" maxlength="60" required>
                </div>
                <div class="field">
                    <label for="memory-text">Entry</label>
                    <textarea id="memory-text" maxlength="2000" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="cancel">Cancel</button>
                    <button type="submit">Save memory</button>
                </div>
            </form>
        </div>

        <div id="settings-panel" class="panel">
            <div class="settings-header">
                <span class="settings-title">Timeline</span>
                <button class="settings-close" aria-label="Close">×</button>
            </div>
            <div class="destination-row">
                <span>Destination</span>
                <span class="name" id="settings-destination">Proxima Centauri</span>
            </div>
            <label>
                <span>Trip duration (yrs)</span>
                <input id="setting-duration" type="number" min="1" max="2000" step="1">
            </label>
            <label>
                <span>Start year</span>
                <input id="setting-start" type="number" min="0" step="1">
            </label>
            <label>
                <span>Step (yrs)</span>
                <input id="setting-step" type="number" min="0.01" max="50" step="0.1">
            </label>
            <button class="settings-reset" id="setting-reset">Reset to defaults</button>
        </div>

        <aside id="pin-popup">
            <button class="close" aria-label="Close">×</button>
            <div class="meta"></div>
            <h2 class="title"></h2>
            <div class="author"></div>
            <div class="text"></div>
        </aside>

        <div id="milestone-toast"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
